name: Build Signed AAB from ZIP (Cordova, SDK 35)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ["*.zip", ".github/workflows/zip-build.yml"]

env:
  APP_ID: com.saiftrisha.rialhisab
  APP_NAME: BkHisab
  VERSION_NAME: 2.3.4
  VERSION_CODE: 8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find your ZIP
        id: z
        run: |
          ZIP=$(ls -1 *.zip | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP found in repo root"; exit 1
          fi
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "Found ZIP: $ZIP"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm i -g cordova@12

      - name: Prepare www from ZIP
        run: |
          rm -rf www
          mkdir -p www
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o "${{ steps.z.outputs.zip }}" -d www
          # যদি ZIP-এর ভিতরে আবার www/www থাকে, ফ্ল্যাট করে দাও
          if [ -d "www/www" ]; then
            shopt -s dotglob
            mv www/www/* www/ || true
            rm -rf www/www
          fi
          ls -la www

      - name: Create config.xml (SDK 35)
        run: |
          cat > config.xml <<EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="${APP_ID}" version="${VERSION_NAME}" android-versionCode="${VERSION_CODE}"
                  xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>${APP_NAME}</name>
            <description>Simple currency calculator for Riyal/Dirham → BDT.</description>
            <author email="taiponormaluse@gmail.com">Saif_Trisha</author>
            <engine name="android" spec="^13.0.0" />
            <allow-navigation href="*"/>
            <allow-intent href="*"/>
            <preference name="android-minSdkVersion" value="24"/>
            <preference name="android-targetSdkVersion" value="35"/>
            <preference name="AndroidXEnabled" value="true"/>
            <preference name="Orientation" value="portrait"/>
            <preference name="Fullscreen" value="false"/>
            <platform name="android">
              <preference name="AndroidWindowSplashScreenBackground" value="#041326"/>
            </platform>
            <plugin name="cordova-plugin-whitelist" spec="^1.3.5"/>
            <plugin name="cordova-plugin-splashscreen" spec="^6.0.2"/>
          </widget>
          EOF

      - name: Add Android platform
        run: |
          cordova platform add android@13
          cordova requirements

      - name: Optional: use app logo as Splash (if exists)
        run: |
          if [ -f "www/m-logo.png" ]; then
            mkdir -p platforms/android/app/src/main/res/drawable
            cp www/m-logo.png platforms/android/app/src/main/res/drawable/splash.png
          elif [ -f "www/m-lgo.png" ]; then
            mkdir -p platforms/android/app/src/main/res/drawable
            cp www/m-lgo.png platforms/android/app/src/main/res/drawable/splash.png
          fi

      # --- Signing setup from Secrets ---
      - name: Decode keystore (p12) and create signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
          mkdir -p platforms/android/app
          mv keystore.p12 platforms/android/app/keystore.p12
          cat > platforms/android/app/release-signing.properties <<PROP
          storeFile=keystore.p12
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          storeType=pkcs12
          PROP
          echo "Created release-signing.properties"

      - name: Build Signed AAB
        run: |
          cordova build android --release -- --packageType=bundle
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.6-bin.zip

      - name: Upload AAB (signed)
        uses: actions/upload-artifact@v4
        with:
          name: bkHisab-aab-signed
          path: platforms/android/app/build/outputs/bundle/release/*.aab
