name: Build signed AAB from ZIP (Cordova, SDK 35)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "*.zip"
      - ".github/workflows/zip-build.yml"

env:
  APP_ID: com.saiftrisha.rialhisab
  APP_NAME: BkHisab
  VERSION_NAME: "2.3.4"
  VERSION_CODE: 8
  MIN_SDK: 24
  TARGET_SDK: 35

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP in repo root
        id: z
        run: |
          ZIP=$(ls -1 *.zip | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "No zip found in repo root"; exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: $ZIP"

      - name: Setup Node (for Cordova CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 + tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Install Cordova 12
        run: npm i -g cordova@12

      - name: Prepare www from ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          rm -rf www
          mkdir -p www
          unzip -oq "${{ steps.z.outputs.zip }}" -d www
          # ZIP এর ভিতরে যদি আরেকটা www/ থাকে, ফ্ল্যাট করুন
          if [ -d "www/www" ]; then
            shopt -s dotglob
            mv www/www/* www/ || true
            rm -rf www/www
          fi
          # অ্যাপে অপ্রয়োজনীয় বড় ফাইল থাকলে মুছে দিন
          rm -f www/*.apk www/*.jks || true
          ls -la www

      - name: Create config.xml (target SDK 35)
        run: |
          cat > config.xml <<EOF
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="${APP_ID}" version="${VERSION_NAME}" android-versionCode="${VERSION_CODE}"
                  xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>${APP_NAME}</name>
            <description>Simple currency calculator for Riyal/Dirham → BDT.</description>
            <author email="taiponormaluse@gmail.com">Saif_Trisha</author>

            <engine name="android" spec="^13.0.0" />

            <allow-navigation href="*" />
            <allow-intent href="*" />

            <preference name="android-minSdkVersion" value="${MIN_SDK}" />
            <preference name="android-targetSdkVersion" value="${TARGET_SDK}" />
            <preference name="AndroidXEnabled" value="true" />
            <preference name="Orientation" value="portrait" />
            <preference name="Fullscreen" value="false" />

            <platform name="android">
              <preference name="AndroidWindowSplashScreenBackground" value="#041326" />
            </platform>

            <plugin name="cordova-plugin-whitelist" spec="^1.3.5" />
            <plugin name="cordova-plugin-splashscreen" spec="^6.0.2" />
          </widget>
          EOF
          echo "Widget ->"; grep "<widget" -n config.xml

      - name: Add Android platform
        run: |
          # চাইলে android@14 ব্যবহার করতে পারেন, তবে 13 সবচেয়ে স্টেবল
          cordova platform add android@13
          chmod +x platforms/android/gradlew
          cordova requirements

      # (Optional) লোগোকে স্প্ল্যাশ হিসেবে কপি করা
      - name: Use app logo as splash if exists (www/m-lgo.png)
        run: |
          if [ -f "www/m-lgo.png" ]; then
            mkdir -p platforms/android/app/src/main/res/drawable
            cp www/m-lgo.png platforms/android/app/src/main/res/drawable/splash.png
          fi

      - name: Decode keystore and create release-signing.properties
        run: |
          mkdir -p platforms/android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > platforms/android/keystore.p12
          cat > platforms/android/release-signing.properties <<EOF
          storeFile=keystore.p12
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeType=pkcs12
          EOF
          ls -la platforms/android

      - name: Build signed AAB (release)
        env:
          # Gradle 8.x দরকার
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.6-bin.zip
        run: |
          cordova build android --release -- --packageType=bundle --no-interactive --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkHisab-signed-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
