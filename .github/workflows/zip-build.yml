name: Build BkHisab AAB (API 35)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node & Cordova (Node 18 + Cordova 12)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: |
          npm i -g cordova@12.0.0
          cordova telemetry off

      - name: Unzip source
        run: unzip -q src_full_fixed_v2.zip -d src

      # ── PROBLEM FIX: sanitize config.xml before adding android
      - name: Sanitize config.xml (remove problematic plugin/edit blocks)
        working-directory: src
        shell: bash
        run: |
          set -e
          CFG="config.xml"
          echo "Before sanitize:"
          grep -n "<plugin\|<edit-config\|<config-file" -n "$CFG" || true

          # remove <edit-config> ... </edit-config>
          sed -i '/<edit-config\b/,/<\/edit-config>/d' "$CFG"
          # remove <config-file ...> ... </config-file>
          sed -i '/<config-file\b/,/<\/config-file>/d' "$CFG"
          # keep only cordova-plugin-whitelist (if present)
          sed -i '/<plugin\b/{/cordova-plugin-whitelist/!d}' "$CFG"

          echo "After sanitize:"
          grep -n "<plugin\|<edit-config\|<config-file" -n "$CFG" || true

          # clean plugins folder & cordova plugin list if exists
          rm -rf plugins
          if [ -f package.json ]; then
            node -e "let p=require('./package.json'); if(p.cordova){p.cordova.plugins={}}; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2));"
          fi

      # ✅ নতুন Version Code এবং Version Name সেট করো
      - name: Update version info
        working-directory: src
        run: |
          CFG="config.xml"
          sed -i 's/android-versionCode="[0-9]\+"/android-versionCode="8"/' "$CFG"
          sed -i 's/version="[^"]\+"/version="2.3.4"/' "$CFG"
          echo "Updated version info:"
          grep -n "<widget" "$CFG" || true

      - name: Add android platform
        working-directory: src
        run: cordova platform add android@14 --no-telemetry

      # Namespace patch (safety)
      - name: Patch missing Android XML namespaces
        working-directory: src
        shell: bash
        run: |
          ANDROIDMANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          [ -f "$ANDROIDMANIFEST" ] && \
          sed -i '1s|<manifest |<manifest xmlns:android="http://schemas.android.com/apk/res/android" |' "$ANDROIDMANIFEST" || true

      - name: Build AAB (Release)
        working-directory: src
        run: cordova build android --release --packageType=bundle --no-telemetry

      - name: Restore keystore from secret
        run: echo "$P12_B64" | base64 -d > keystore.p12
        env:
          P12_B64: ${{ secrets.P12_B64 }}

      - name: Inspect keystore (debug)
        run: |
          keytool -list -v -storetype PKCS12 -keystore keystore.p12 -storepass "$P12_PASSWORD"
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

      - name: Sign the AAB
        run: |
          AAB=src/platforms/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.p12 -storetype PKCS12 -storepass "$P12_PASSWORD" \
            -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BkHisab-release-aab
          path: src/platforms/android/app/build/outputs/bundle/release/app-release.aab
